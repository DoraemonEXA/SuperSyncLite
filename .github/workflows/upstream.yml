name: Check upstream stable release
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-upstream.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
